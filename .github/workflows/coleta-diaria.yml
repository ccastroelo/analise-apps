name: Coleta diária das lojas

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 em Brasília; os relatórios do dia anterior já saíram
  workflow_dispatch:
    inputs:
      days_back:
        description: "Quantos dias para trás recoletar (ex.: 365 na primeira vez)"
        default: "7"

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

permissions:
  contents: write # commit do histórico cifrado
  pages: write
  id-token: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Coletar e gerar painel
        run: python -m coletor.main
        env:
          DAYS_BACK: ${{ inputs.days_back }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GPLAY_BUCKET: ${{ secrets.GPLAY_BUCKET }}
          GPLAY_PACKAGES: ${{ secrets.GPLAY_PACKAGES }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}

      - name: Salvar histórico cifrado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.enc
          git diff --cached --quiet || git commit -m "Atualiza histórico das lojas"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
